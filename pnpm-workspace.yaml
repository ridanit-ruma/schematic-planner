packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"

# pnpm blocks dependency install scripts by default. These need to run: esbuild
# and the Tailwind/Prisma engines link a platform binary, and argon2 compiles a
# native module.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@tailwindcss/oxide": true
  argon2: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

# Single source of truth for every third-party version in the repo. Workspaces
# reference these with `catalog:` instead of a version range, so an upgrade
# happens here once rather than in nine package.json files.
catalog:
  # Language and build
  typescript: 5.9.3
  tsup: ^8.5.1
  turbo: ^2.10.12
  "@types/node": ^24.13.3

  # Lint and format
  eslint: ^10.10.0
  "@eslint/js": ^10.0.1
  typescript-eslint: ^8.69.0
  prettier: ^3.9.6

  # Test
  vitest: ^5.0.0

  # Shared domain
  zod: ^4.5.4
  yjs: ^13.6.32
  elkjs: ^0.12.0
  jszip: ^3.10.1
  gray-matter: ^4.0.3
  nanoid: ^6.0.1

  # API
  "@nestjs/cli": ^12.0.0
  "@nestjs/common": ^12.0.1
  "@nestjs/config": ^12.0.0
  "@nestjs/core": ^12.0.1
  "@nestjs/jwt": ^12.0.1
  "@nestjs/platform-express": ^12.0.1
  "@nestjs/throttler": ^6.5.0
  "@nestjs/testing": ^12.0.1
  "@prisma/adapter-pg": ^7.10.0
  "@prisma/client": ^7.10.0
  prisma: ^7.10.0
  pg: ^8.23.0
  "@types/pg": ^8.23.1
  "@hocuspocus/server": ^4.6.0
  "@modelcontextprotocol/sdk": ^1.30.0
  argon2: ^0.45.1
  cookie-parser: ^1.4.7
  helmet: ^8.3.0
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  ws: ^8.21.3
  "@types/cookie-parser": ^1.4.9
  "@types/express": ^5.0.6
  "@types/ws": ^8.18.1

  # Web
  react: ^19.2.8
  react-dom: ^19.2.8
  "@types/react": ^19.2.7
  "@types/react-dom": ^19.2.4
  vite: ^8.2.2
  puppeteer-core: ^25.10.0
  "@vitejs/plugin-react": ^6.1.1
  "@xyflow/react": ^12.11.6
  "@hocuspocus/provider": ^4.6.0
  zustand: ^5.0.15
  react-router: ^8.3.1
  "@tanstack/react-query": ^5.102.8
  radix-ui: ^1.6.7
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^3.6.0
  lucide-react: ^1.41.0
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  "@tailwindcss/postcss": ^4.3.3

  # Marketing site
  next: ^16.3.4
