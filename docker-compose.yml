# Local development dependencies only. The application itself runs from
# `pnpm dev` on the host while iterating.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-schematic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schematic}
      POSTGRES_DB: ${POSTGRES_DB:-schematic}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-schematic}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
