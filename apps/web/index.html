<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schematic Planner</title>
    <meta name="description" content="Plan in the browser. Own the output." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />

    <!--
      The card a link to the application unfurls into.

      Deliberately the same for every address inside it, and deliberately says
      nothing about what is there. A crawler cannot sign in, and an unfurl is
      shown to everybody in the channel somebody pasted the link into — so a
      plan's title in this card would hand it to people who cannot open the
      plan. The marketing site says more, because everything on it is public.

      Per-page titles are set by the application once it is running, which is
      what makes the browser tab useful; a crawler does not get that far.

      The image is under /assets/ because that is the path the application owns
      and the proxy already serves from its own root. The marketing site has its
      own copy at /og.png: the two are deployed separately, and an instance that
      runs only the application still has to have a card.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Schematic Planner" />
    <meta property="og:title" content="Schematic Planner" />
    <meta
      property="og:description"
      content="A plan on the canvas. You need an account on this instance to open it."
    />
    <meta property="og:image" content="/assets/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Schematic Planner" />
    <meta
      name="twitter:description"
      content="A plan on the canvas. You need an account on this instance to open it."
    />
    <meta name="twitter:image" content="/assets/og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!--
      Runtime configuration. Deliberately a separate file rather than build-time
      environment variables: one built bundle then runs in every environment,
      and a deployment only replaces this file.
    -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
