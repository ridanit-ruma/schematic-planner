# The server: REST, the MCP endpoint and the collaboration socket, in one
# process — which is why there is exactly one of it. See the README.
apiVersion: v1
kind: Service
metadata:
  name: schematic-planner-api
spec:
  selector:
    app.kubernetes.io/name: schematic-planner
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 3001
      targetPort: 3001
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: schematic-planner-uploads
spec:
  accessModes: ['ReadWriteOnce']
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schematic-planner-api
spec:
  replicas: 1
  # Replace, never roll: two of these would each hold their own copy of every
  # open plan, and the copies would drift.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: schematic-planner
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: schematic-planner
        app.kubernetes.io/component: api
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        # Before the process that serves the schema starts, on every rollout and
        # not only the first.
        - name: migrate
          image: schematic-planner.local/api
          # Never pulled: there is no registry behind that name. The image is
          # on the node before the tag naming it reaches the cluster.
          imagePullPolicy: IfNotPresent
          command: ['node_modules/.bin/prisma', 'migrate', 'deploy']
          envFrom:
            - configMapRef:
                name: schematic-planner
            - secretRef:
                name: schematic-planner
      containers:
        - name: api
          image: schematic-planner.local/api
          # Never pulled: there is no registry behind that name. The image is
          # on the node before the tag naming it reaches the cluster.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: schematic-planner
            - secretRef:
                name: schematic-planner
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
          # Liveness asks whether the process is alive; readiness asks whether
          # the database is there. A container that cannot reach it yet should
          # be given the chance to, not killed.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: schematic-planner-uploads
