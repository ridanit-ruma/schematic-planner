# Production deployment. One command, three containers, one address.
#
#   cp .env.example .env      # then fill in the secrets and SITE_URL
#   docker compose -f deploy/compose.yaml up -d --build
#
# Everything is reached through the proxy on one origin, which is what keeps the
# session cookie same-site and removes CORS from the picture entirely.

name: schematic-planner

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-schematic}:${POSTGRES_PASSWORD:-schematic}@postgres:5432/${POSTGRES_DB:-schematic}?schema=public
  API_HOST: 0.0.0.0
  API_PORT: "3001"
  # The proxy strips /api before forwarding, so the server's own public address
  # is the site address plus that prefix.
  API_PUBLIC_URL: ${SITE_URL:-http://localhost:8080}/api
  APP_PUBLIC_URL: ${SITE_URL:-http://localhost:8080}
  # One origin, so nothing is cross-site and this list stays empty in practice.
  CORS_ORIGINS: ${SITE_URL:-http://localhost:8080}
  TRUST_PROXY: "true"
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?generate one with: openssl rand -base64 48}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?generate one with: openssl rand -base64 48}
  ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
  RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
  RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-10}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-schematic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schematic}
      POSTGRES_DB: ${POSTGRES_DB:-schematic}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-schematic}']
      interval: 5s
      timeout: 5s
      retries: 20

  # Runs to completion before the API starts, so a rolling restart never serves
  # against a schema it does not expect.
  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ['node_modules/.bin/prisma', 'migrate', 'deploy']
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:8080}
        NEXT_PUBLIC_APP_URL: ${SITE_URL:-http://localhost:8080}/login
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ':8080'
      UPSTREAM_API: api:3001
    ports:
      - '${PORT:-8080}:8080'
    depends_on:
      - api

volumes:
  postgres-data:
